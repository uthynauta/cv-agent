name: cv-agent

services:
  cv-agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6}
      GROUNDING_MODE: ${GROUNDING_MODE:-inference}
      INGESTION_MODE: ${INGESTION_MODE:-openai}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-lexical}
      RERANK_MODEL: ${RERANK_MODEL:-}
      RERANK_TOP_K: ${RERANK_TOP_K:-20}
      ANSWER_TOP_K: ${ANSWER_TOP_K:-5}
      CONTEXT_MODE: ${CONTEXT_MODE:-page}
      MAX_CONTEXT_CHARS: ${MAX_CONTEXT_CHARS:-12000}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      ADMIN_UI_PASSWORD: ${ADMIN_UI_PASSWORD:-}
      ADMIN_UI_SESSION_SECRET: ${ADMIN_UI_SESSION_SECRET:-}
      ADMIN_UI_SESSION_MAX_AGE_SECONDS: ${ADMIN_UI_SESSION_MAX_AGE_SECONDS:-43200}
      ADMIN_UPLOAD_MAX_BYTES: ${ADMIN_UPLOAD_MAX_BYTES:-10485760}
      ADMIN_BACKUP_MAX_BYTES: ${ADMIN_BACKUP_MAX_BYTES:-104857600}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-10}
      DATA_DIR: /data
      AGENT_OWNER_NAME: ${AGENT_OWNER_NAME:-}
      AGENT_DISPLAY_NAME: ${AGENT_DISPLAY_NAME:-CV Agent}
      AGENT_DESCRIPTION: ${AGENT_DESCRIPTION:-Ask questions about the configured knowledge base.}
      AGENT_LANGUAGE: ${AGENT_LANGUAGE:-auto}
      DATA_GIT_AUTHOR_NAME: ${DATA_GIT_AUTHOR_NAME:-CV Agent}
      DATA_GIT_AUTHOR_EMAIL: ${DATA_GIT_AUTHOR_EMAIL:-cv-agent@localhost}
      AGENT_MODEL_NAME: ${AGENT_MODEL_NAME:-cv-agent}
      AGENT_PUBLIC_URL: ${AGENT_PUBLIC_URL:-}
      PUBLIC_REQUEST_BODY_LIMIT_BYTES: ${PUBLIC_REQUEST_BODY_LIMIT_BYTES:-16384}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-cv-agent}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
    volumes:
      - ${CV_AGENT_DATA_DIR:-./data}:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
